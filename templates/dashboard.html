<!DOCTYPE html>
<html>

<head>
    <title>Task Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Smart Task Management System</h1>

        <!-- TASK FORM -->
        <div class="card">

            <h2>Add Task</h2>

            <input type="text" id="title" placeholder="Task Title">

            <input type="text"
                   id="description"
                   placeholder="Description">

            <select id="priority">
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
            </select>

            <select id="status">
                <option>Pending</option>
                <option>Completed</option>
            </select>

            <button onclick="addTask()">
                Add Task
            </button>

        </div>

        <!-- ANALYTICS -->
        <div class="card">

            <h2>Analytics</h2>

            <p id="analytics"></p>

        </div>

        <!-- TASK LIST -->
        <div class="card">

            <h2>All Tasks</h2>

            <div id="taskList"></div>

        </div>

    </div>

<script>

async function addTask() {

    const taskData = {

        title: document.getElementById('title').value,

        description: document.getElementById('description').value,

        priority: document.getElementById('priority').value,

        status: document.getElementById('status').value
    }

    const response = await fetch('/tasks', {

        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify(taskData)
    })

    const data = await response.json()

    alert(data.message)

    loadTasks()

    loadAnalytics()
}


async function loadTasks() {

    const response = await fetch('/tasks')

    const tasks = await response.json()

    let output = ""

    tasks.forEach(task => {

        output += `
            <div class="task-card">

                <h3>${task.title}</h3>

                <p>${task.description}</p>

                <p>Priority: ${task.priority}</p>

                <p>Status: ${task.status}</p>

            </div>
        `
    })

    document.getElementById('taskList').innerHTML = output
}


async function loadAnalytics() {

    const response = await fetch('/analytics')

    const data = await response.json()

    document.getElementById('analytics').innerHTML = `
        Total Tasks: ${data.total_tasks} <br>
        Completed Tasks: ${data.completed_tasks} <br>
        Pending Tasks: ${data.pending_tasks} <br>
        Completion Percentage: ${data.completion_percentage}%
    `
}

loadTasks()

loadAnalytics()

</script>

<!-- SOCKET.IO -->
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

<script>

var socket = io()

socket.on('task_update', function(data) {

    alert(data.message)

    loadTasks()

    loadAnalytics()
})

</script>

</body>
</html>
